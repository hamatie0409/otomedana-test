name: 日次ビルド（楽天の情報だけ更新）

# 価格・在庫は楽天ウェブサービスの規約で取得から24時間しか保持できないので、
# 毎日取り直して作り直す。
#
# **カタログ（作品一覧・版・URL）はここでは絶対に作り直さない。**
# 乙女ゲームの判定はVNDBのタグ投票の平均でしていて日々動くため、
# 自動で作り直すと収録作品が出入りし、URLも変わりうる。
# 作り直すのは rebuild-db.yml を手で実行したときだけ。
on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC = 22:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 楽天の取得だけで約30分かかる
    env:
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 認証情報の確認
        run: |
          if [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "::error::RAKUTEN_ACCESS_KEY が未設定です。" \
                 "Settings > Secrets and variables > Actions で登録してください"
            exit 1
          fi

      - name: カタログDBを取ってくる
        # DBはリリース db-latest に置いてある成果物。ここでは作らない。
        run: |
          mkdir -p data
          if ! gh release download db-latest --pattern vndb_otome.db --dir data --clobber; then
            echo "::error::リリース db-latest からDBを取得できませんでした。"
            echo "::error::先に「カタログDBを作り直す」ワークフローを実行するか、"
            echo "::error::手元から gh release upload db-latest data/vndb_otome.db してください"
            exit 1
          fi
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/vndb_otome.db")
          n = con.execute("SELECT COUNT(*) FROM games").fetchone()[0]
          e = con.execute("SELECT COUNT(*) FROM editions").fetchone()[0]
          print("カタログ: 作品 %d件 / 版 %d件" % (n, e))
          assert n > 3000 and e > 5000, "カタログの中身が足りません"
          PY

      - name: 作品情報の訂正を反映する
        # corrections/works.csv（git 管理下）に書いた訂正と日本語あらすじ。
        # data/ は git 管理外で、カタログを作り直すとDBの中身は再生成されるので、
        # ビルドのたびにここで流し込む。1件でも検証に落ちればビルドを止める
        run: python3 scripts/corrections.py --apply

      - name: 発売元から有志翻訳グループを外す
        # VNDB の publishers には世界中のリリースの発売元が入り、有志の翻訳
        # グループや個人が混ざる。VNDB API で言語と種別を引いて選り分ける。
        # 取得済みの分はDBに残るので、2回目以降はほぼ待ち時間なしで終わる
        run: python3 scripts/producers.py --apply

      - name: 購入先URLを作る
        run: python3 scripts/offers.py

      - name: 楽天から価格を取る（約30分・1秒1リクエスト）
        run: |
          python3 scripts/rakuten_prices.py --only-scope
          python3 scripts/rakuten_prices.py --by-title

      - name: パッケージ画像を選ぶ
        run: python3 scripts/shop_images.py

      - name: サイトを生成する（v1・docs/ 直下）
        # site_build.py は docs/ を丸ごと消してから作り直す。
        # docs/v2/ もその巻き添えで消えるので、v2 は必ずこの後に建てること。
        run: |
          python3 scripts/site_data.py
          python3 scripts/site_build.py

      - name: サイトを生成する（v2・docs/v2/）
        # 新デザイン「オトメ棚」。原本DBは読むだけで、表示用の data/site2.db を
        # 組み立ててから docs/v2/ を作る。消すのは docs/v2/ の中だけなので
        # v1 には影響しない。
        run: |
          python3 scripts/site2_db.py
          python3 scripts/site2_build.py

      - name: 生成できたか確かめる
        run: |
          v1=$(find docs -name index.html -not -path 'docs/v2/*' | wc -l)
          v2=$(find docs/v2 -name index.html | wc -l)
          echo "生成ページ数: v1 $v1 / v2 $v2 / 合計 $((v1 + v2))"
          if [ "$v1" -lt 6000 ]; then
            echo "::error::v1 のページ数が少なすぎます（$v1）。公開せずに止めます"
            exit 1
          fi
          if [ "$v2" -lt 6000 ]; then
            echo "::error::v2 のページ数が少なすぎます（$v2）。公開せずに止めます"
            exit 1
          fi
          # GitHub Actions の bash は pipefail が有効なので、
          # grep が0件で終わってもジョブが落ちないように包む
          priced=$( { grep -rl 'class="price-note"' docs/game || true; } | wc -l )
          echo "価格が出ているページ: $priced"
          if [ "$priced" -lt 300 ]; then
            echo "::warning::価格の入ったページが少ないです（$priced）。楽天の取得を確認してください"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
