name: 日次ビルド（楽天の情報だけ更新）

# 価格・在庫は楽天ウェブサービスの規約で取得から24時間しか保持できないので、
# 毎日取り直して作り直す。
#
# **カタログ（作品一覧・版・URL）はここでは絶対に作り直さない。**
# 乙女ゲームの判定はVNDBのタグ投票の平均でしていて日々動くため、
# 自動で作り直すと収録作品が出入りし、URLも変わりうる。
# 作り直すのは rebuild-db.yml を手で実行したときだけ。
on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC = 22:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 楽天の取得だけで約30分かかる
    env:
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 認証情報の確認
        run: |
          if [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "::error::RAKUTEN_ACCESS_KEY が未設定です。" \
                 "Settings > Secrets and variables > Actions で登録してください"
            exit 1
          fi

      - name: カタログDBを取ってくる
        # DBはリリース db-latest に置いてある成果物。ここでは作らない。
        run: |
          mkdir -p data
          if ! gh release download db-latest --pattern vndb_otome.db --dir data --clobber; then
            echo "::error::リリース db-latest からDBを取得できませんでした。"
            echo "::error::先に「カタログDBを作り直す」ワークフローを実行するか、"
            echo "::error::手元から gh release upload db-latest data/vndb_otome.db してください"
            exit 1
          fi
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/vndb_otome.db")
          n = con.execute("SELECT COUNT(*) FROM games").fetchone()[0]
          e = con.execute("SELECT COUNT(*) FROM editions").fetchone()[0]
          print("カタログ: 作品 %d件 / 版 %d件" % (n, e))
          assert n > 3000 and e > 5000, "カタログの中身が足りません"
          PY

      - name: 購入先URLを作る
        run: python3 scripts/offers.py

      - name: 楽天から価格を取る（約30分・1秒1リクエスト）
        run: |
          python3 scripts/rakuten_prices.py --only-scope
          python3 scripts/rakuten_prices.py --by-title

      - name: パッケージ画像を選ぶ
        run: python3 scripts/shop_images.py

      - name: サイトを生成する
        run: |
          python3 scripts/site_data.py
          python3 scripts/site_build.py

      - name: 生成できたか確かめる
        run: |
          pages=$(find docs -name index.html | wc -l)
          echo "生成ページ数: $pages"
          if [ "$pages" -lt 6000 ]; then
            echo "::error::ページ数が少なすぎます（$pages）。公開せずに止めます"
            exit 1
          fi
          # GitHub Actions の bash は pipefail が有効なので、
          # grep が0件で終わってもジョブが落ちないように包む
          priced=$( { grep -rl 'class="price-note"' docs/game || true; } | wc -l )
          echo "価格が出ているページ: $priced"
          if [ "$priced" -lt 300 ]; then
            echo "::warning::価格の入ったページが少ないです（$priced）。楽天の取得を確認してください"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
